name: Validar

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  skill:
    name: Skill y SQLite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: clasificar-facturas-iva-aeat/requirements.txt
      - run: pip install -r clasificar-facturas-iva-aeat/requirements.txt
      - name: Compilar scripts
        run: python -m py_compile clasificar-facturas-iva-aeat/scripts/*.py
      - name: Ejecutar pruebas de regresión
        run: python -m unittest discover -s clasificar-facturas-iva-aeat/tests -v
      - name: Consultar cobertura
        run: python clasificar-facturas-iva-aeat/scripts/query_index.py stats
      - name: Comprobar integridad SQLite
        run: |
          python - <<'PY'
          import sqlite3
          db = "clasificar-facturas-iva-aeat/assets/aeat_iva.sqlite"
          with sqlite3.connect(db) as conn:
              assert conn.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
              assert conn.execute("SELECT COUNT(*) FROM cases").fetchone()[0] == 3069
          PY
