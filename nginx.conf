server {
    listen 80;
    server_name www.hacienda-303.686f6c61.dev;
    return 308 https://hacienda-303.686f6c61.dev$request_uri;
}

server {
    listen 80 default_server;
    server_name hacienda-303.686f6c61.dev _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # SPA estática autohospedada: sin scripts inline (el JSON-LD de index.html es
    # application/ld+json, no ejecutable), fuentes @fontsource y assets locales.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        # Un add_header propio anula la herencia de los del nivel server:
        # hay que repetir aquí las cabeceras de seguridad.
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    }

    location = /tecnica {
        try_files /tecnica/index.html =404;
    }

    location = /tecnica/ {
        try_files /tecnica/index.html =404;
    }

    location = /empezar {
        try_files /empezar/index.html =404;
    }

    location = /empezar/ {
        try_files /empezar/index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
